naftiko: 1.0.0-alpha1
info:
  label: Amazon CodeDeploy Deployment Automation
  description: Unified workflow for DevOps teams to create deployment groups, deploy revisions to EC2, Lambda, and ECS targets, and monitor deployment status.
  tags:
  - Amazon
  - AWS
  - Deployment
  - DevOps
  - CI/CD
  - Release Management
  created: '2026-04-19'
  modified: '2026-04-19'
binds:
- namespace: env
  keys:
    AWS_ACCESS_KEY_ID: AWS_ACCESS_KEY_ID
    AWS_SECRET_ACCESS_KEY: AWS_SECRET_ACCESS_KEY
    AWS_REGION: AWS_REGION
capability:
  consumes:
  - import: codedeploy
    location: ./shared/codedeploy.yaml
  exposes:
  - type: rest
    port: 8080
    namespace: codedeploy-deployment-api
    description: Unified REST API for CodeDeploy deployment automation.
    resources:
    - path: /v1/applications
      name: applications
      description: Manage CodeDeploy applications
    - path: /v1/deployments
      name: deployments
      description: Create and monitor deployments
    - path: /v1/deployment-groups
      name: deployment-groups
      description: Manage deployment groups
  - type: mcp
    port: 9090
    namespace: codedeploy-deployment-mcp
    transport: http
    description: MCP server for AI-assisted deployment management.
    tools:
    - name: list-applications
      description: List CodeDeploy applications
      hints:
        readOnly: true
        openWorld: true
      call: codedeploy.listApplications
      outputParameters:
      - type: object
        mapping: $.
    - name: create-application
      description: Create a CodeDeploy application
      hints:
        readOnly: false
        openWorld: false
      call: codedeploy.createApplication
      outputParameters:
      - type: object
        mapping: $.
    - name: list-deployment-groups
      description: List deployment groups for an application
      hints:
        readOnly: true
        openWorld: true
      call: codedeploy.listDeploymentGroups
      outputParameters:
      - type: object
        mapping: $.
    - name: create-deployment
      description: Create a new deployment
      hints:
        readOnly: false
        openWorld: false
      call: codedeploy.createDeployment
      outputParameters:
      - type: object
        mapping: $.
    - name: get-deployment
      description: Get details about a specific deployment
      hints:
        readOnly: true
        openWorld: true
      call: codedeploy.getDeployment
      outputParameters:
      - type: object
        mapping: $.
    - name: list-deployments
      description: List deployments for an application and deployment group
      hints:
        readOnly: true
        openWorld: true
      call: codedeploy.listDeployments
      outputParameters:
      - type: object
        mapping: $.
    - name: stop-deployment
      description: Stop an in-progress deployment
      hints:
        readOnly: false
        destructive: false
        openWorld: false
      call: codedeploy.stopDeployment
      outputParameters:
      - type: object
        mapping: $.
    - name: get-deployment-instance
      description: Get deployment information for a target instance
      hints:
        readOnly: true
        openWorld: true
      call: codedeploy.getDeploymentInstance
      outputParameters:
      - type: object
        mapping: $.
    - name: list-deployment-instances
      description: List instances in a deployment
      hints:
        readOnly: true
        openWorld: true
      call: codedeploy.listDeploymentInstances
      outputParameters:
      - type: object
        mapping: $.
    - name: create-deployment-group
      description: Create a deployment group for an application
      hints:
        readOnly: false
        openWorld: false
      call: codedeploy.createDeploymentGroup
      outputParameters:
      - type: object
        mapping: $.

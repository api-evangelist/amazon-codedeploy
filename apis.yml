  - aid: amazon-codedeploy:amazon-codedeploy-api
    name: Amazon CodeDeploy API
    description: >-
      The Amazon CodeDeploy REST API enables programmatic management of applications, deployment groups, deployment
      configurations, and deployments. Create and update deployment groups, trigger deployments to EC2, Lambda, ECS,
      and on-premises targets, monitor deployment status, and manage deployment lifecycle hooks and rollback policies.

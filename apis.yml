  - type: Features
    data:
      - name: Multiple Deployment Strategies
        description: >-
          Support for in-place, blue/green, and canary deployment strategies across EC2, Lambda, ECS, and on-premises
          targets to minimize downtime and risk.
      - name: Automated Rollbacks
        description: >-
          Automatically roll back deployments if a specified number of instances fail health checks or if CloudWatch
          alarms are triggered during deployment.
      - name: Deployment Lifecycle Hooks
        description: >-
          Define custom lifecycle event hooks (BeforeInstall, AfterInstall, ApplicationStart, etc.) using scripts or
          Lambda functions for fine-grained deployment control.
      - name: Traffic Shifting for Lambda and ECS
        description: >-
          Implement canary and linear traffic shifting for Lambda function updates and ECS service deployments with
          configurable traffic weights and bake times.
      - name: Deployment Groups
        description: >-
          Organize deployment targets using deployment groups with EC2 instance tags, Auto Scaling groups, ECS clusters,
          or on-premises instance tags.
      - name: CodeDeploy Agent
        description: >-
          Install the CodeDeploy agent on EC2 or on-premises instances to enable deployment target registration and
          lifecycle hook execution.
      - name: Integration with AWS Load Balancers
        description: >-
          Integrate with Application Load Balancers and Network Load Balancers for blue/green deployments that shift
          traffic between original and replacement instances.
  - type: UseCases
    data:
      - name: Zero-Downtime Application Updates
        description: >-
          Use blue/green deployments to update applications without downtime by routing traffic to a new environment
          while keeping the original environment available for rollback.
      - name: Lambda Function Updates
        description: >-
          Deploy new Lambda function versions with canary or linear traffic shifting to gradually migrate traffic from
          the current version to the updated function version.
      - name: ECS Service Deployment
        description: >-
          Deploy updated container tasks to ECS services with blue/green deployments and configurable traffic shifting
          through an Application Load Balancer.
      - name: On-Premises Application Deployment
        description: >-
          Extend cloud-based deployment automation to on-premises servers using the CodeDeploy agent and on-premises
          instance registration.
      - name: Multi-Stage CD Pipeline
        description: >-
          Use CodeDeploy as the deployment stage in an AWS CodePipeline for fully automated continuous delivery from
          source code to production.
  - type: Integrations
    data:
      - name: AWS CodePipeline
        description: Use CodeDeploy as the deployment stage in CodePipeline CD pipelines.
      - name: AWS CodeBuild
        description: Trigger CodeDeploy deployments from build artifacts produced by CodeBuild.
      - name: AWS Lambda
        description: Deploy Lambda function updates with traffic shifting strategies.
      - name: Amazon ECS
        description: Deploy ECS service updates with blue/green deployments.
      - name: AWS CloudWatch
        description: Trigger automatic rollbacks based on CloudWatch alarm states.
      - name: Elastic Load Balancing
        description: Integrate with ALB and NLB for blue/green traffic shifting.
      - name: Amazon EC2 Auto Scaling
        description: Deploy to Auto Scaling groups with automatic instance health checking.
      - name: AWS Systems Manager
        description: Use SSM Run Command and State Manager for deployment automation.
      - name: GitHub
        description: Deploy application revisions stored in GitHub repositories.
      - name: Amazon S3
        description: Store and retrieve application deployment bundles from S3.

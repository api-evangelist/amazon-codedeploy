aid: amazon-codedeploy
name: Amazon CodeDeploy
description: >-
  AWS CodeDeploy is a fully managed deployment service that automates software deployments to various compute services
  such as Amazon EC2, AWS Fargate, AWS Lambda, and on-premises servers. CodeDeploy makes it easier to rapidly release
  new features, helps avoid downtime during application deployment, and handles the complexity of updating your
  applications with in-place, blue/green, and canary deployment strategies.
type: Index

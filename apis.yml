name: Amazon CodeDeploy API
description: AWS CodeDeploy is a fully managed deployment service that automates software deployments to a variety of compute services such as Amazon EC2, AWS Fargate, AWS Lambda, and on-premises servers, making it easier to rapidly release new features and avoid downtime during deployment.
image: https://a0.awsstatic.com/libra-css/images/logos/aws_logo_smile_1200x630.png
url: https://aws.amazon.com/codedeploy/
created: '2024-01-15'
modified: '2026-03-13'
apis:
- name: Amazon CodeDeploy API
  description: >-
    API for automating code deployments to any instance, including Amazon
    EC2 instances, on-premises servers, Lambda functions, and ECS services.
    Supports creating applications and deployment groups, managing
    deployment configurations, triggering deployments, and monitoring
    deployment status with automatic rollback capabilities.

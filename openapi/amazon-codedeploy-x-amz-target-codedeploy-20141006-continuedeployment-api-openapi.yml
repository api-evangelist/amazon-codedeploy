tags:
- name: '#X Amz Target=CodeDeploy 20141006.ContinueDeployment'
paths:
  /#X-Amz-Target=CodeDeploy_20141006.ContinueDeployment:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: ContinueDeployment
      description: For a blue/green deployment, starts the process of rerouting traffic from instances in the original environment to instances in the replacement environment without waiting for a specified wait time to elapse. (Traffic rerouting, which is achieved by registering instances in the replacement environment with the load balancer, can start as soon as all instances have a status of Ready.)
      responses:
        '200':
          description: Success
        '480':
          description: DeploymentIdRequiredException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentIdRequiredException'
              examples:
                ContinueDeployment480Example:
                  summary: Default ContinueDeployment 480 response
                  x-microcks-default: true
                  value: example-value
        '481':
          description: DeploymentDoesNotExistException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentDoesNotExistException'
              examples:
                ContinueDeployment481Example:
                  summary: Default ContinueDeployment 481 response
                  x-microcks-default: true
                  value: example-value
        '482':
          description: DeploymentAlreadyCompletedException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentAlreadyCompletedException'
              examples:
                ContinueDeployment482Example:
                  summary: Default ContinueDeployment 482 response
                  x-microcks-default: true
                  value: example-value
        '483':
          description: InvalidDeploymentIdException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidDeploymentIdException'
              examples:
                ContinueDeployment483Example:
                  summary: Default ContinueDeployment 483 response
                  x-microcks-default: true
                  value: example-value
        '484':
          description: DeploymentIsNotInReadyStateException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentIsNotInReadyStateException'
              examples:
                ContinueDeployment484Example:
                  summary: Default ContinueDeployment 484 response
                  x-microcks-default: true
                  value: example-value
        '485':
          description: UnsupportedActionForDeploymentTypeException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnsupportedActionForDeploymentTypeException'
              examples:
                ContinueDeployment485Example:
                  summary: Default ContinueDeployment 485 response
                  x-microcks-default: true
                  value: example-value
        '486':
          description: InvalidDeploymentWaitTypeException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidDeploymentWaitTypeException'
              examples:
                ContinueDeployment486Example:
                  summary: Default ContinueDeployment 486 response
                  x-microcks-default: true
                  value: example-value
        '487':
          description: InvalidDeploymentStatusException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidDeploymentStatusException'
              examples:
                ContinueDeployment487Example:
                  summary: Default ContinueDeployment 487 response
                  x-microcks-default: true
                  value: example-value
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContinueDeploymentInput'
            examples:
              ContinueDeploymentRequestExample:
                summary: Default ContinueDeployment request
                x-microcks-default: true
                value:
                  deploymentId: '500123'
                  deploymentWaitType: STANDARD
      parameters:
      - name: X-Amz-Target
        in: header
        required: true
        schema:
          type: string
          enum:
          - CodeDeploy_20141006.ContinueDeployment
      summary: Amazon CodeDeploy Continue Deployment
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - '#X Amz Target=CodeDeploy 20141006.ContinueDeployment'
components:
  parameters:
    X-Amz-Security-Token:
      name: X-Amz-Security-Token
      in: header
      schema:
        type: string
      required: false
    X-Amz-Algorithm:
      name: X-Amz-Algorithm
      in: header
      schema:
        type: string
      required: false
    X-Amz-Content-Sha256:
      name: X-Amz-Content-Sha256
      in: header
      schema:
        type: string
      required: false
    X-Amz-Date:
      name: X-Amz-Date
      in: header
      schema:
        type: string
      required: false
    X-Amz-Credential:
      name: X-Amz-Credential
      in: header
      schema:
        type: string
      required: false
    X-Amz-SignedHeaders:
      name: X-Amz-SignedHeaders
      in: header
      schema:
        type: string
      required: false
    X-Amz-Signature:
      name: X-Amz-Signature
      in: header
      schema:
        type: string
      required: false
  schemas:
    InvalidDeploymentWaitTypeException: {}
    DeploymentDoesNotExistException: {}
    DeploymentIdRequiredException: {}
    InvalidDeploymentStatusException: {}
    InvalidDeploymentIdException: {}
    DeploymentIsNotInReadyStateException: {}
    DeploymentWaitType:
      type: string
      enum:
      - READY_WAIT
      - TERMINATION_WAIT
    DeploymentAlreadyCompletedException: {}
    UnsupportedActionForDeploymentTypeException: {}
    DeploymentId:
      type: string
    ContinueDeploymentInput:
      type: object
      title: ContinueDeploymentInput
      properties:
        deploymentId:
          allOf:
          - $ref: '#/components/schemas/DeploymentId'
          - description: ' The unique ID of a blue/green deployment for which you want to start rerouting traffic to the replacement environment. '
        deploymentWaitType:
          allOf:
          - $ref: '#/components/schemas/DeploymentWaitType'
          - description: ' The status of the deployment''s waiting period. <code>READY_WAIT</code> indicates that the deployment is ready to start shifting traffic. <code>TERMINATION_WAIT</code> indicates that the traffic is shifted, but the original target is not terminated. '
  securitySchemes:
    hmac:
      type: apiKey
      name: Authorization
      in: header
      description: Amazon Signature authorization v4
      x-amazon-apigateway-authtype: awsSigv4

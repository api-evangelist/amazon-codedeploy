openapi: 3.2.0
info:
  title: Amazon CodeDeploy Applications API
  description: AWS CodeDeploy is a fully managed deployment service that automates software deployments to a variety of compute services such as Amazon EC2, AWS Fargate, AWS Lambda, and your on-premises servers. CodeDeploy makes it easier to rapidly release new features, helps you avoid downtime during deployment, and handles the complexity of updating your applications.
  version: '2014-10-06'
  contact:
    name: Amazon Web Services
    url: https://aws.amazon.com/contact-us/
  termsOfService: https://aws.amazon.com/service-terms/
servers:
- url: https://codedeploy.{region}.amazonaws.com
  description: Amazon CodeDeploy Regional Endpoint
  variables:
    region:
      default: us-east-1
      description: AWS Region
tags:
- name: Applications
  description: Operations for creating and managing CodeDeploy applications
paths:
  /applications:
    post:
      operationId: CreateApplication
      summary: Amazon CodeDeploy Create an Application
      description: Creates an application. An application is a name that represents the compute platform on which you deploy (EC2/On-premises, Lambda, or ECS).
      tags:
      - Applications
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApplicationRequest'
            examples:
              CreateApplicationRequestExample:
                summary: Default CreateApplication request
                x-microcks-default: true
                value:
                  applicationName: example-resource
                  computePlatform: Server
      responses:
        '200':
          description: Application created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateApplicationResponse'
              examples:
                CreateApplication200Example:
                  summary: Default CreateApplication 200 response
                  x-microcks-default: true
                  value:
                    applicationId: '500123'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidApplicationNameException'
              examples:
                CreateApplication400Example:
                  summary: Default CreateApplication 400 response
                  x-microcks-default: true
                  value:
                    message: example-value
        '409':
          description: Application already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationAlreadyExistsException'
              examples:
                CreateApplication409Example:
                  summary: Default CreateApplication 409 response
                  x-microcks-default: true
                  value:
                    message: example-value
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerException'
              examples:
                CreateApplication500Example:
                  summary: Default CreateApplication 500 response
                  x-microcks-default: true
                  value:
                    message: example-value
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
    get:
      operationId: ListApplications
      summary: Amazon CodeDeploy List Applications
      description: Lists the applications registered with the user or AWS account.
      tags:
      - Applications
      parameters:
      - name: nextToken
        in: query
        description: Token for pagination.
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListApplicationsResponse'
              examples:
                ListApplications200Example:
                  summary: Default ListApplications 200 response
                  x-microcks-default: true
                  value:
                    applications:
                    - example-value
                    nextToken: example-value
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidNextTokenException'
              examples:
                ListApplications400Example:
                  summary: Default ListApplications 400 response
                  x-microcks-default: true
                  value:
                    message: example-value
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerException'
              examples:
                ListApplications500Example:
                  summary: Default ListApplications 500 response
                  x-microcks-default: true
                  value:
                    message: example-value
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
  /applications/{applicationName}:
    get:
      operationId: GetApplication
      summary: Amazon CodeDeploy Get Application Details
      description: Gets information about an application.
      tags:
      - Applications
      parameters:
      - name: applicationName
        in: path
        required: true
        description: The name of the application.
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetApplicationResponse'
              examples:
                GetApplication200Example:
                  summary: Default GetApplication 200 response
                  x-microcks-default: true
                  value:
                    application:
                      applicationId: '500123'
                      applicationName: example-resource
                      computePlatform: example-value
                      createTime: example-value
                      linkedToGitHub: true
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidApplicationNameException'
              examples:
                GetApplication400Example:
                  summary: Default GetApplication 400 response
                  x-microcks-default: true
                  value:
                    message: example-value
        '404':
          description: Application not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationDoesNotExistException'
              examples:
                GetApplication404Example:
                  summary: Default GetApplication 404 response
                  x-microcks-default: true
                  value:
                    message: example-value
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerException'
              examples:
                GetApplication500Example:
                  summary: Default GetApplication 500 response
                  x-microcks-default: true
                  value:
                    message: example-value
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
    delete:
      operationId: DeleteApplication
      summary: Amazon CodeDeploy Delete an Application
      description: Deletes an application along with all associated deployment groups and revisions.
      tags:
      - Applications
      parameters:
      - name: applicationName
        in: path
        required: true
        description: The name of the application to delete.
        schema:
          type: string
      responses:
        '200':
          description: Application deleted
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidApplicationNameException'
              examples:
                DeleteApplication400Example:
                  summary: Default DeleteApplication 400 response
                  x-microcks-default: true
                  value:
                    message: example-value
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerException'
              examples:
                DeleteApplication500Example:
                  summary: Default DeleteApplication 500 response
                  x-microcks-default: true
                  value:
                    message: example-value
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
components:
  schemas:
    GetApplicationResponse:
      type: object
      properties:
        application:
          type: object
          properties:
            applicationId:
              type: string
            applicationName:
              type: string
            computePlatform:
              type: string
            createTime:
              type: string
              format: date-time
            linkedToGitHub:
              type: boolean
    ApplicationDoesNotExistException:
      type: object
      properties:
        message:
          type: string
    CreateApplicationRequest:
      type: object
      required:
      - applicationName
      properties:
        applicationName:
          type: string
          description: The name of the application.
        computePlatform:
          type: string
          description: The destination platform type for the deployment.
          enum:
          - Server
          - Lambda
          - ECS
    InvalidApplicationNameException:
      type: object
      properties:
        message:
          type: string
    ListApplicationsResponse:
      type: object
      properties:
        applications:
          type: array
          items:
            type: string
        nextToken:
          type: string
    CreateApplicationResponse:
      type: object
      properties:
        applicationId:
          type: string
          description: A unique application ID.
    ApplicationAlreadyExistsException:
      type: object
      properties:
        message:
          type: string
    InvalidNextTokenException:
      type: object
      properties:
        message:
          type: string
    InternalServerException:
      type: object
      properties:
        message:
          type: string
externalDocs:
  description: Amazon CodeDeploy API Reference
  url: https://docs.aws.amazon.com/codedeploy/latest/APIReference/

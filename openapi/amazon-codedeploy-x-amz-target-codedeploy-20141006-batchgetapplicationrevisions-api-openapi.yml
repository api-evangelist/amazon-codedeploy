    post:
      operationId: BatchGetApplicationRevisions
      description: Gets information about one or more application revisions. The maximum number of application revisions that can be returned is 25.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchGetApplicationRevisionsOutput'
              examples:
                BatchGetApplicationRevisions200Example:
                  summary: Default BatchGetApplicationRevisions 200 response
                  x-microcks-default: true
                  value:
                    applicationName: example-resource
                    errorMessage: example-value
                    revisions: example-value
        '480':

                  x-microcks-default: true
                  value: example-value
        '484':
          description: InvalidRevisionException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRevisionException'
              examples:
                BatchGetApplicationRevisions484Example:
                  summary: Default BatchGetApplicationRevisions 484 response
                  x-microcks-default: true
                  value: example-value
        '485':
          description: BatchLimitExceededException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchLimitExceededException'
              examples:
                BatchGetApplicationRevisions485Example:
                  summary: Default BatchGetApplicationRevisions 485 response
                  x-microcks-default: true

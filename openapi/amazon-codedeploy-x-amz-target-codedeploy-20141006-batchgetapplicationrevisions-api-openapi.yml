                  summary: Default BatchGetApplicationRevisions 480 response
                  x-microcks-default: true
                  value: example-value
        '481':
          description: ApplicationNameRequiredException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationNameRequiredException'
              examples:

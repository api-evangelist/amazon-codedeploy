tags:
- name: '#X Amz Target=CodeDeploy 20141006.StopDeployment'
paths:
  /#X-Amz-Target=CodeDeploy_20141006.StopDeployment:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: StopDeployment
      description: Attempts to stop an ongoing deployment.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StopDeploymentOutput'
              examples:
                StopDeployment200Example:
                  summary: Default StopDeployment 200 response
                  x-microcks-default: true
                  value:
                    status: ACTIVE
                    statusMessage: ACTIVE
        '480':
          description: DeploymentIdRequiredException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentIdRequiredException'
              examples:
                StopDeployment480Example:
                  summary: Default StopDeployment 480 response
                  x-microcks-default: true
                  value: example-value
        '481':
          description: DeploymentDoesNotExistException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentDoesNotExistException'
              examples:
                StopDeployment481Example:
                  summary: Default StopDeployment 481 response
                  x-microcks-default: true
                  value: example-value
        '482':
          description: DeploymentGroupDoesNotExistException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentGroupDoesNotExistException'
              examples:
                StopDeployment482Example:
                  summary: Default StopDeployment 482 response
                  x-microcks-default: true
                  value: example-value
        '483':
          description: DeploymentAlreadyCompletedException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentAlreadyCompletedException'
              examples:
                StopDeployment483Example:
                  summary: Default StopDeployment 483 response
                  x-microcks-default: true
                  value: example-value
        '484':
          description: InvalidDeploymentIdException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidDeploymentIdException'
              examples:
                StopDeployment484Example:
                  summary: Default StopDeployment 484 response
                  x-microcks-default: true
                  value: example-value
        '485':
          description: UnsupportedActionForDeploymentTypeException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnsupportedActionForDeploymentTypeException'
              examples:
                StopDeployment485Example:
                  summary: Default StopDeployment 485 response
                  x-microcks-default: true
                  value: example-value
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StopDeploymentInput'
            examples:
              StopDeploymentRequestExample:
                summary: Default StopDeployment request
                x-microcks-default: true
                value:
                  deploymentId: '500123'
                  autoRollbackEnabled: example-value
      parameters:
      - name: X-Amz-Target
        in: header
        required: true
        schema:
          type: string
          enum:
          - CodeDeploy_20141006.StopDeployment
      summary: Amazon CodeDeploy Stop Deployment
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - '#X Amz Target=CodeDeploy 20141006.StopDeployment'
components:
  schemas:
    StopDeploymentInput:
      type: object
      required:
      - deploymentId
      title: StopDeploymentInput
      properties:
        deploymentId:
          allOf:
          - $ref: '#/components/schemas/DeploymentId'
          - description: ' The unique ID of a deployment. '
        autoRollbackEnabled:
          allOf:
          - $ref: '#/components/schemas/NullableBoolean'
          - description: ' Indicates, when a deployment is stopped, whether instances that have been updated should be rolled back to the previous version of the application revision. '
      description: ' Represents the input of a <code>StopDeployment</code> operation. '
    UnsupportedActionForDeploymentTypeException: {}
    DeploymentDoesNotExistException: {}
    NullableBoolean:
      type: boolean
    DeploymentAlreadyCompletedException: {}
    InvalidDeploymentIdException: {}
    Message:
      type: string
    StopStatus:
      type: string
      enum:
      - Pending
      - Succeeded
    DeploymentGroupDoesNotExistException: {}
    StopDeploymentOutput:
      type: object
      properties:
        status:
          allOf:
          - $ref: '#/components/schemas/StopStatus'
          - description: '<p>The status of the stop deployment operation:</p> <ul> <li> <p>Pending: The stop operation is pending.</p> </li> <li> <p>Succeeded: The stop operation was successful.</p> </li> </ul>'
        statusMessage:
          allOf:
          - $ref: '#/components/schemas/Message'
          - description: An accompanying status message.
      description: ' Represents the output of a <code>StopDeployment</code> operation. '
    DeploymentId:
      type: string
    DeploymentIdRequiredException: {}

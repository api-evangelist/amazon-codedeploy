components:
  parameters:
    X-Amz-Content-Sha256:
      name: X-Amz-Content-Sha256
      in: header
      schema:
        type: string
      required: false
    X-Amz-Algorithm:
      name: X-Amz-Algorithm
      in: header
      schema:
        type: string
      required: false
    X-Amz-Credential:
      name: X-Amz-Credential
      in: header
      schema:
        type: string
      required: false
    X-Amz-SignedHeaders:
      name: X-Amz-SignedHeaders
      in: header
      schema:
        type: string
      required: false
    X-Amz-Signature:
      name: X-Amz-Signature
      in: header
      schema:
        type: string
      required: false
    X-Amz-Date:
      name: X-Amz-Date
      in: header
      schema:
        type: string
      required: false
    X-Amz-Security-Token:
      name: X-Amz-Security-Token
      in: header
      schema:
        type: string
      required: false
  schemas:
    TagResourceInput:
      type: object
      required:
      - ResourceArn
      - Tags
      title: TagResourceInput
      properties:
        ResourceArn:
          allOf:
          - $ref: '#/components/schemas/Arn'
          - description: ' The ARN of a resource, such as a CodeDeploy application or deployment group. '
        Tags:
          allOf:
          - $ref: '#/components/schemas/TagList'
          - description: ' A list of tags that <code>TagResource</code> associates with a resource. The resource is identified by the <code>ResourceArn</code> input parameter. '
    TagList:
      type: array
      items:
        $ref: '#/components/schemas/Tag'
    InvalidTagsToAddException: {}
    Key:
      type: string
    DeploymentConfigDoesNotExistException: {}
    Arn:
      type: string
      minLength: 1
      maxLength: 1011
    InvalidArnException: {}
    ArnNotSupportedException: {}
    Value:
      type: string
    Tag:
      type: object
      properties:
        Key:
          allOf:
          - $ref: '#/components/schemas/Key'
          - description: The tag's key.
        Value:
          allOf:
          - $ref: '#/components/schemas/Value'
          - description: The tag's value.
      description: Information about a tag.
    TagResourceOutput:
      type: object
      properties: {}
    ApplicationDoesNotExistException: {}
    DeploymentGroupDoesNotExistException: {}
    TagRequiredException: {}
    ResourceArnRequiredException: {}
  securitySchemes:
    hmac:
      type: apiKey
      name: Authorization
      in: header
      description: Amazon Signature authorization v4
      x-amazon-apigateway-authtype: awsSigv4

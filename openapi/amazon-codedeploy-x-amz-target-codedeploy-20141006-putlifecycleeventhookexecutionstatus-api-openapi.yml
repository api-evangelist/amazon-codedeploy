paths:
  /#X-Amz-Target=CodeDeploy_20141006.PutLifecycleEventHookExecutionStatus:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'

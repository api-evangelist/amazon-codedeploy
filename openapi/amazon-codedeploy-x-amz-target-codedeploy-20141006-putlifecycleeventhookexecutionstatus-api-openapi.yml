    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: PutLifecycleEventHookExecutionStatus
      description: Sets the result of a Lambda validation function. The function validates lifecycle hooks during a deployment that uses the Lambda or Amazon ECS compute platform. For Lambda deployments, the available lifecycle hooks are BeforeAllowTraffic and AfterAllowTraffic. For Amazon ECS deployments, the available lifecycle hooks are BeforeInstall, AfterInstall, AfterAllowTestTraffic, BeforeAllowTraffic, and AfterAllowTraffic. Lambda validation functions return Succeeded or Failed. For more information, see AppSpec 'hooks' Section for an Lambda Deployment and AppSpec 'hooks' Section for an Amazon ECS Deployment.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PutLifecycleEventHookExecutionStatusOutput'
              examples:
                PutLifecycleEventHookExecutionStatus200Example:
                  summary: Default PutLifecycleEventHookExecutionStatus 200 response
                  x-microcks-default: true
                  value:
                    lifecycleEventHookExecutionId: '500123'
        '480':
          description: InvalidLifecycleEventHookExecutionStatusException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidLifecycleEventHookExecutionStatusException'
              examples:
                PutLifecycleEventHookExecutionStatus480Example:
                  summary: Default PutLifecycleEventHookExecutionStatus 480 response
                  x-microcks-default: true
                  value: ACTIVE
        '481':
          description: InvalidLifecycleEventHookExecutionIdException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidLifecycleEventHookExecutionIdException'
              examples:
                PutLifecycleEventHookExecutionStatus481Example:
                  summary: Default PutLifecycleEventHookExecutionStatus 481 response
                  x-microcks-default: true
                  value: ACTIVE
        '482':
          description: LifecycleEventAlreadyCompletedException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LifecycleEventAlreadyCompletedException'
              examples:
                PutLifecycleEventHookExecutionStatus482Example:

tags:
- name: '#X Amz Target=CodeDeploy 20141006.GetDeploymentConfig'
paths:
  /#X-Amz-Target=CodeDeploy_20141006.GetDeploymentConfig:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: GetDeploymentConfig
      description: Gets information about a deployment configuration.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetDeploymentConfigOutput'
              examples:
                GetDeploymentConfig200Example:
                  summary: Default GetDeploymentConfig 200 response
                  x-microcks-default: true
                  value:
                    deploymentConfigInfo: example-value
        '480':
          description: InvalidDeploymentConfigNameException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidDeploymentConfigNameException'
              examples:
                GetDeploymentConfig480Example:
                  summary: Default GetDeploymentConfig 480 response
                  x-microcks-default: true
                  value: example-value
        '481':
          description: DeploymentConfigNameRequiredException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentConfigNameRequiredException'
              examples:
                GetDeploymentConfig481Example:
                  summary: Default GetDeploymentConfig 481 response
                  x-microcks-default: true
                  value: example-value
        '482':
          description: DeploymentConfigDoesNotExistException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentConfigDoesNotExistException'
              examples:
                GetDeploymentConfig482Example:
                  summary: Default GetDeploymentConfig 482 response
                  x-microcks-default: true
                  value: example-value
        '483':
          description: InvalidComputePlatformException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidComputePlatformException'
              examples:
                GetDeploymentConfig483Example:
                  summary: Default GetDeploymentConfig 483 response
                  x-microcks-default: true
                  value: example-value
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetDeploymentConfigInput'
            examples:
              GetDeploymentConfigRequestExample:
                summary: Default GetDeploymentConfig request
                x-microcks-default: true
                value:
                  deploymentConfigName: example-resource
      parameters:
      - name: X-Amz-Target
        in: header
        required: true
        schema:
          type: string
          enum:
          - CodeDeploy_20141006.GetDeploymentConfig
      summary: Amazon CodeDeploy Get Deployment Config
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - '#X Amz Target=CodeDeploy 20141006.GetDeploymentConfig'
components:
  parameters:
    X-Amz-Content-Sha256:
      name: X-Amz-Content-Sha256
      in: header
      schema:
        type: string
      required: false
    X-Amz-Algorithm:
      name: X-Amz-Algorithm
      in: header
      schema:
        type: string
      required: false
    X-Amz-Credential:
      name: X-Amz-Credential
      in: header
      schema:
        type: string
      required: false
    X-Amz-SignedHeaders:
      name: X-Amz-SignedHeaders
      in: header
      schema:
        type: string
      required: false
    X-Amz-Signature:
      name: X-Amz-Signature
      in: header
      schema:
        type: string
      required: false
    X-Amz-Date:
      name: X-Amz-Date
      in: header
      schema:
        type: string
      required: false
    X-Amz-Security-Token:
      name: X-Amz-Security-Token
      in: header
      schema:
        type: string
      required: false
  schemas:
    TrafficRoutingType:
      type: string
      enum:
      - TimeBasedCanary
      - TimeBasedLinear
      - AllAtOnce
    Percentage:
      type: integer
    WaitTimeInMins:
      type: integer
    InvalidDeploymentConfigNameException: {}
    DeploymentConfigId:
      type: string
    DeploymentConfigDoesNotExistException: {}
    TimeBasedLinear:
      type: object
      properties:
        linearPercentage:
          allOf:
          - $ref: '#/components/schemas/Percentage'
          - description: The percentage of traffic that is shifted at the start of each increment of a <code>TimeBasedLinear</code> deployment.
        linearInterval:
          allOf:
          - $ref: '#/components/schemas/WaitTimeInMins'
          - description: The number of minutes between each incremental traffic shift of a <code>TimeBasedLinear</code> deployment.
      description: A configuration that shifts traffic from one version of a Lambda function or ECS task set to another in equal increments, with an equal number of minutes between each increment. The original and target Lambda function versions or ECS task sets are specified in the deployment's AppSpec file.
    GetDeploymentConfigOutput:
      type: object
      properties:
        deploymentConfigInfo:
          allOf:
          - $ref: '#/components/schemas/DeploymentConfigInfo'
          - description: Information about the deployment configuration.
      description: Represents the output of a <code>GetDeploymentConfig</code> operation.
    TimeBasedCanary:
      type: object
      properties:
        canaryPercentage:
          allOf:
          - $ref: '#/components/schemas/Percentage'
          - description: The percentage of traffic to shift in the first increment of a <code>TimeBasedCanary</code> deployment.
        canaryInterval:
          allOf:
          - $ref: '#/components/schemas/WaitTimeInMins'
          - description: The number of minutes between the first and second traffic shifts of a <code>TimeBasedCanary</code> deployment.
      description: A configuration that shifts traffic from one version of a Lambda function or Amazon ECS task set to another in two increments. The original and target Lambda function versions or ECS task sets are specified in the deployment's AppSpec file.
    MinimumHealthyHostsValue:
      type: integer
    DeploymentConfigNameRequiredException: {}
    DeploymentConfigName:
      type: string
      minLength: 1
      maxLength: 100
    MinimumHealthyHostsType:
      type: string
      enum:
      - HOST_COUNT
      - FLEET_PERCENT
    Timestamp:
      type: string
      format: date-time
    GetDeploymentConfigInput:
      type: object
      required:
      - deploymentConfigName
      title: GetDeploymentConfigInput
      properties:
        deploymentConfigName:
          allOf:
          - $ref: '#/components/schemas/DeploymentConfigName'
          - description: The name of a deployment configuration associated with the IAM user or Amazon Web Services account.
      description: Represents the input of a <code>GetDeploymentConfig</code> operation.
    TrafficRoutingConfig:
      type: object
      properties:
        type:
          allOf:
          - $ref: '#/components/schemas/TrafficRoutingType'
          - description: The type of traffic shifting (<code>TimeBasedCanary</code> or <code>TimeBasedLinear</code>) used by a deployment configuration.
        timeBasedCanary:
          allOf:
          - $ref: '#/components/schemas/TimeBasedCanary'
          - description: A configuration that shifts traffic from one version of a Lambda function or ECS task set to another in two increments. The original and target Lambda function versions or ECS task sets are specified in the deployment's AppSpec file.
        timeBasedLinear:
          allOf:
          - $ref: '#/components/schemas/TimeBasedLinear'
          - description: A configuration that shifts traffic from one version of a Lambda function or Amazon ECS task set to another in equal increments, with an equal number of minutes between each increment. The original and target Lambda function versions or Amazon ECS task sets are specified in the deployment's AppSpec file.
      description: The configuration that specifies how traffic is shifted from one version of a Lambda function to another version during an Lambda deployment, or from one Amazon ECS task set to another during an Amazon ECS deployment.
    DeploymentConfigInfo:
      type: object
      properties:
        deploymentConfigId:
          allOf:
          - $ref: '#/components/schemas/DeploymentConfigId'
          - description: The deployment configuration ID.
        deploymentConfigName:
          allOf:
          - $ref: '#/components/schemas/DeploymentConfigName'
          - description: The deployment configuration name.
        minimumHealthyHosts:
          allOf:
          - $ref: '#/components/schemas/MinimumHealthyHosts'
          - description: Information about the number or percentage of minimum healthy instance.
        createTime:
          allOf:
          - $ref: '#/components/schemas/Timestamp'
          - description: The time at which the deployment configuration was created.
        computePlatform:
          allOf:
          - $ref: '#/components/schemas/ComputePlatform'
          - description: The destination platform type for the deployment (<code>Lambda</code>, <code>Server</code>, or <code>ECS</code>).
        trafficRoutingConfig:
          allOf:
          - $ref: '#/components/schemas/TrafficRoutingConfig'
          - description: The configuration that specifies how the deployment traffic is routed. Used for deployments with a Lambda or Amazon ECS compute platform only.
      description: Information about a deployment configuration.
    InvalidComputePlatformException: {}
    MinimumHealthyHosts:
      type: object
      properties:
        type:
          allOf:
          - $ref: '#/components/schemas/MinimumHealthyHostsType'
          - description: '<p>The minimum healthy instance type:</p> <ul> <li> <p> <code>HOST_COUNT</code>: The minimum number of healthy instances as an absolute value.</p> </li> <li> <p> <code>FLEET_PERCENT</code>: The minimum number of healthy instances as a percentage of the total number of instances in the deployment.</p> </li> </ul> <p>In an example of nine instances, if a HOST_COUNT of six is specified, deploy to up to three instances at a time. The deployment is successful if six or more instances are deployed to successfully. Otherwise, the deployment fails. If a FLEET_PERCENT of 40 is specified, deploy to up to five instances at a time. The deployment is successful if four or more instances are deployed to successfully. Otherwise, the deployment fails.</p> <note> <p>In a call to the <code>GetDeploymentConfig</code>, CodeDeployDefault.OneAtATime returns a minimum healthy instance type of MOST_CONCURRENCY and a value of 1. This means a deployment to only one instance at a time. (You cannot set the type to MOST_CONCURRENCY, only to HOST_COUNT or FLEET_PERCENT.) In addition, with CodeDeployDefault.OneAtATime, CodeDeploy attempts to ensure that all instances but one are kept in a healthy state during the deployment. Although this allows one instance at a time to be taken offline for a new deployment, it also means that if the deployment to the last instance fails, the overall deployment is still successful.</p> </note> <p>For more information, see <a href="https://docs.aws.amazon.com/codedeploy/latest/userguide/instances-health.html">CodeDeploy Instance Health</a> in the <i>CodeDeploy User Guide</i>.</p>'
        value:
          allOf:
          - $ref: '#/components/schemas/MinimumHealthyHostsValue'
          - description: The minimum healthy instance value.
      description: Information about minimum healthy instance.
    ComputePlatform:
      type: string
      enum:
      - Server
      - Lambda
      - ECS
  securitySchemes:
    hmac:
      type: apiKey
      name: Authorization
      in: header
      description: Amazon Signature authorization v4
      x-amazon-apigateway-authtype: awsSigv4
externalDocs:
  description: Amazon Web Services documentation
  url: https://docs.aws.amazon.com/codedeploy/

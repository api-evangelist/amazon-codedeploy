    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: ListOnPremisesInstances
      description: 'Gets a list of names for one or more on-premises instances.


        Unless otherwise specified, both registered and deregistered on-premises instance names are listed. To list only registered or deregistered on-premises instance names, use the registration status parameter.'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListOnPremisesInstancesOutput'
              examples:
                ListOnPremisesInstances200Example:
                  summary: Default ListOnPremisesInstances 200 response
                  x-microcks-default: true
                  value:
                    instanceNames: example-resource
                    nextToken: example-value
        '480':
          description: InvalidRegistrationStatusException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRegistrationStatusException'
              examples:
                ListOnPremisesInstances480Example:
                  summary: Default ListOnPremisesInstances 480 response
                  x-microcks-default: true
                  value: example-value
        '481':
          description: InvalidTagFilterException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidTagFilterException'
              examples:
                ListOnPremisesInstances481Example:
                  summary: Default ListOnPremisesInstances 481 response
                  x-microcks-default: true
                  value: example-value
        '482':
          description: InvalidNextTokenException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidNextTokenException'
              examples:
                ListOnPremisesInstances482Example:
                  summary: Default ListOnPremisesInstances 482 response
                  x-microcks-default: true
                  value: example-value
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListOnPremisesInstancesInput'
            examples:
              ListOnPremisesInstancesRequestExample:
                summary: Default ListOnPremisesInstances request
                x-microcks-default: true
                value:
                  registrationStatus: ACTIVE
                  tagFilters: example-value
                  nextToken: example-value
      parameters:
      - name: X-Amz-Target
        in: header
        required: true
        schema:

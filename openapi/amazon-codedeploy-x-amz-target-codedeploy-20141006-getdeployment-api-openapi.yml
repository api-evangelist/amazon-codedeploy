    AlarmList:
      type: array
      items:
        $ref: '#/components/schemas/Alarm'
    RawStringSha256:
      type: string
    ApplicationName:
      type: string
      minLength: 1
      maxLength: 100
    ErrorInformation:
      type: object
      properties:
        code:
          allOf:
          - $ref: '#/components/schemas/ErrorCode'
          - description: '<p>For more information, see <a href="https://docs.aws.amazon.com/codedeploy/latest/userguide/error-codes.html">Error Codes for CodeDeploy</a> in the <a href="https://docs.aws.amazon.com/codedeploy/latest/userguide">CodeDeploy User Guide</a>.</p> <p>The error code:</p> <ul> <li> <p>APPLICATION_MISSING: The application was missing. This error code is most likely raised if the application is deleted after the deployment is created, but before it is started.</p> </li> <li> <p>DEPLOYMENT_GROUP_MISSING: The deployment group was missing. This error code is most likely raised if the deployment group is deleted after the deployment is created, but before it is started.</p> </li> <li> <p>HEALTH_CONSTRAINTS: The deployment failed on too many instances to be successfully deployed within the instance health constraints specified.</p> </li> <li> <p>HEALTH_CONSTRAINTS_INVALID: The revision cannot be successfully deployed within the instance health constraints specified.</p> </li> <li> <p>IAM_ROLE_MISSING: The service role cannot be accessed.</p> </li> <li> <p>IAM_ROLE_PERMISSIONS: The service role does not have the correct permissions.</p> </li> <li> <p>INTERNAL_ERROR: There was an internal error.</p> </li> <li> <p>NO_EC2_SUBSCRIPTION: The calling account is not subscribed to Amazon EC2.</p> </li> <li> <p>NO_INSTANCES: No instances were specified, or no instances can be found.</p> </li> <li> <p>OVER_MAX_INSTANCES: The maximum number of instances was exceeded.</p> </li> <li> <p>THROTTLED: The operation was throttled because the calling account exceeded the throttling limits of one or more Amazon Web Services services.</p> </li> <li> <p>TIMEOUT: The deployment has timed out.</p> </li> <li> <p>REVISION_MISSING: The revision ID was missing. This error code is most likely raised if the revision is deleted after the deployment is created, but before it is started.</p> </li> </ul>'
        message:
          allOf:
          - $ref: '#/components/schemas/ErrorMessage'
          - description: An accompanying error message.
      description: Information about a deployment error.
    ELBName:
      type: string
    S3Location:
      type: object
      properties:
        bucket:
          allOf:
          - $ref: '#/components/schemas/S3Bucket'
          - description: The name of the Amazon S3 bucket where the application revision is stored.
        key:
          allOf:
          - $ref: '#/components/schemas/S3Key'
          - description: The name of the Amazon S3 object that represents the bundled artifacts for the application revision.
        bundleType:
          allOf:
          - $ref: '#/components/schemas/BundleType'
          - description: '<p>The file type of the application revision. Must be one of the following:</p> <ul> <li> <p> <code>tar</code>: A tar archive file.</p> </li> <li> <p> <code>tgz</code>: A compressed tar archive file.</p> </li> <li> <p> <code>zip</code>: A zip archive file.</p> </li> </ul>'
        version:
          allOf:
          - $ref: '#/components/schemas/VersionId'
          - description: <p>A specific version of the Amazon S3 object that represents the bundled artifacts for the application revision.</p> <p>If the version is not specified, the system uses the most recent version by default.</p>
        eTag:
          allOf:
          - $ref: '#/components/schemas/ETag'
          - description: <p>The ETag of the Amazon S3 object that represents the bundled artifacts for the application revision.</p> <p>If the ETag is not specified as an input parameter, ETag validation of the object is skipped.</p>
      description: Information about the location of application artifacts stored in Amazon S3.
    DeploymentConfigName:
      type: string
      minLength: 1
      maxLength: 100
    TrafficRoute:
      type: object
      properties:
        listenerArns:
          allOf:
          - $ref: '#/components/schemas/ListenerArnList'
          - description: ' The Amazon Resource Name (ARN) of one listener. The listener identifies the route between a target group and a load balancer. This is an array of strings with a maximum size of one. '
      description: ' Information about a listener. The listener contains the path used to route traffic that is received from the load balancer to a target group. '
    DeploymentInfo:
      type: object
      properties:
        applicationName:
          allOf:
          - $ref: '#/components/schemas/ApplicationName'
          - description: The application name.
        deploymentGroupName:
          allOf:
          - $ref: '#/components/schemas/DeploymentGroupName'
          - description: ' The deployment group name. '
        deploymentConfigName:
          allOf:
          - $ref: '#/components/schemas/DeploymentConfigName'
          - description: ' The deployment configuration name. '
        deploymentId:
          allOf:
          - $ref: '#/components/schemas/DeploymentId'
          - description: ' The unique ID of a deployment. '
        previousRevision:
          allOf:
          - $ref: '#/components/schemas/RevisionLocation'
          - description: Information about the application revision that was deployed to the deployment group before the most recent successful deployment.
        revision:
          allOf:
          - $ref: '#/components/schemas/RevisionLocation'
          - description: Information about the location of stored application artifacts and the service from which to retrieve them.
        status:
          allOf:
          - $ref: '#/components/schemas/DeploymentStatus'
          - description: The current state of the deployment as a whole.
        errorInformation:
          allOf:
          - $ref: '#/components/schemas/ErrorInformation'
          - description: Information about any error associated with this deployment.
        createTime:
          allOf:
          - $ref: '#/components/schemas/Timestamp'
          - description: A timestamp that indicates when the deployment was created.
        startTime:
          allOf:
          - $ref: '#/components/schemas/Timestamp'
          - description: <p>A timestamp that indicates when the deployment was deployed to the deployment group.</p> <p>In some cases, the reported value of the start time might be later than the complete time. This is due to differences in the clock settings of backend servers that participate in the deployment process.</p>
        completeTime:
          allOf:
          - $ref: '#/components/schemas/Timestamp'
          - description: A timestamp that indicates when the deployment was complete.
        deploymentOverview:
          allOf:
          - $ref: '#/components/schemas/DeploymentOverview'
          - description: A summary of the deployment status of the instances in the deployment.
        description:
          allOf:
          - $ref: '#/components/schemas/Description'
          - description: A comment about the deployment.
        creator:
          allOf:
          - $ref: '#/components/schemas/DeploymentCreator'
          - description: '<p>The means by which the deployment was created:</p> <ul> <li> <p> <code>user</code>: A user created the deployment.</p> </li> <li> <p> <code>autoscaling</code>: Amazon EC2 Auto Scaling created the deployment.</p> </li> <li> <p> <code>codeDeployRollback</code>: A rollback process created the deployment.</p> </li> <li> <p> <code>CodeDeployAutoUpdate</code>: An auto-update process created the deployment when it detected outdated Amazon EC2 instances.</p> </li> </ul>'
        ignoreApplicationStopFailures:
          allOf:
          - $ref: '#/components/schemas/Boolean'
          - description: <p> If true, then if an <code>ApplicationStop</code>, <code>BeforeBlockTraffic</code>, or <code>AfterBlockTraffic</code> deployment lifecycle event to an instance fails, then the deployment continues to the next deployment lifecycle event. For example, if <code>ApplicationStop</code> fails, the deployment continues with DownloadBundle. If <code>BeforeBlockTraffic</code> fails, the deployment continues with <code>BlockTraffic</code>. If <code>AfterBlockTraffic</code> fails, the deployment continues with <code>ApplicationStop</code>. </p> <p> If false or not specified, then if a lifecycle event fails during a deployment to an instance, that deployment fails. If deployment to that instance is part of an overall deployment and the number of healthy hosts is not less than the minimum number of healthy hosts, then a deployment to the next instance is attempted. </p> <p> During a deployment, the CodeDeploy agent runs the scripts specified for <code>ApplicationStop</code>, <code>BeforeBlockTraffic</code>, and <code>AfterBlockTraffic</code> in the AppSpec file from the previous successful deployment. (All other scripts are run from the AppSpec file in the current deployment.) If one of these scripts contains an error and does not run successfully, the deployment can fail. </p> <p> If the cause of the failure is a script from the last successful deployment that will never run successfully, create a new deployment and use <code>ignoreApplicationStopFailures</code> to specify that the <code>ApplicationStop</code>, <code>BeforeBlockTraffic</code>, and <code>AfterBlockTraffic</code> failures should be ignored. </p>
        autoRollbackConfiguration:
          allOf:
          - $ref: '#/components/schemas/AutoRollbackConfiguration'
          - description: Information about the automatic rollback configuration associated with the deployment.
        updateOutdatedInstancesOnly:
          allOf:
          - $ref: '#/components/schemas/Boolean'
          - description: Indicates whether only instances that are not running the latest application revision are to be deployed to.
        rollbackInfo:
          allOf:
          - $ref: '#/components/schemas/RollbackInfo'
          - description: Information about a deployment rollback.
        deploymentStyle:
          allOf:
          - $ref: '#/components/schemas/DeploymentStyle'
          - description: Information about the type of deployment, either in-place or blue/green, you want to run and whether to route deployment traffic behind a load balancer.
        targetInstances:
          allOf:
          - $ref: '#/components/schemas/TargetInstances'
          - description: Information about the instances that belong to the replacement environment in a blue/green deployment.
        instanceTerminationWaitTimeStarted:
          allOf:
          - $ref: '#/components/schemas/Boolean'
          - description: Indicates whether the wait period set for the termination of instances in the original environment has started. Status is 'false' if the KEEP_ALIVE option is specified. Otherwise, 'true' as soon as the termination wait period starts.
        blueGreenDeploymentConfiguration:
          allOf:
          - $ref: '#/components/schemas/BlueGreenDeploymentConfiguration'
          - description: Information about blue/green deployment options for this deployment.
        loadBalancerInfo:
          allOf:
          - $ref: '#/components/schemas/LoadBalancerInfo'
          - description: Information about the load balancer used in the deployment.
        additionalDeploymentStatusInfo:
          allOf:
          - $ref: '#/components/schemas/AdditionalDeploymentStatusInfo'
          - description: Provides information about the results of a deployment, such as whether instances in the original environment in a blue/green deployment were not terminated.
        fileExistsBehavior:
          allOf:
          - $ref: '#/components/schemas/FileExistsBehavior'
          - description: '<p>Information about how CodeDeploy handles files that already exist in a deployment target location but weren''t part of the previous successful deployment.</p> <ul> <li> <p> <code>DISALLOW</code>: The deployment fails. This is also the default behavior if no option is specified.</p> </li> <li> <p> <code>OVERWRITE</code>: The version of the file from the application revision currently being deployed replaces the version already on the instance.</p> </li> <li> <p> <code>RETAIN</code>: The version of the file already on the instance is kept and used as part of the new deployment.</p> </li> </ul>'
        deploymentStatusMessages:
          allOf:
          - $ref: '#/components/schemas/DeploymentStatusMessageList'
          - description: Messages that contain information about the status of a deployment.
        computePlatform:
          allOf:
          - $ref: '#/components/schemas/ComputePlatform'
          - description: The destination platform type for the deployment (<code>Lambda</code>, <code>Server</code>, or <code>ECS</code>).
        externalId:
          allOf:
          - $ref: '#/components/schemas/ExternalId'
          - description: The unique ID for an external resource (for example, a CloudFormation stack ID) that is linked to this deployment.
        relatedDeployments:
          $ref: '#/components/schemas/RelatedDeployments'
        overrideAlarmConfiguration:
          $ref: '#/components/schemas/AlarmConfiguration'
      description: Information about a deployment.
    EC2TagFilterType:
      type: string
      enum:
      - KEY_ONLY
      - VALUE_ONLY
      - KEY_AND_VALUE
    CommitId:
      type: string

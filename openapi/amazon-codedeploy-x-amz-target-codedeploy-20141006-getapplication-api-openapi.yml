      description: Represents the output of a <code>GetApplication</code> operation.
    InvalidApplicationNameException: {}
    ApplicationId:
      type: string
    Timestamp:
      type: string
      format: date-time
    ApplicationName:
      type: string
      minLength: 1
      maxLength: 100
    ApplicationDoesNotExistException: {}
    ComputePlatform:
      type: string
      enum:
      - Server
      - Lambda
      - ECS
    ApplicationInfo:
      type: object
      properties:
        applicationId:
          allOf:
          - $ref: '#/components/schemas/ApplicationId'
